<!DOCTYPE html>
<html lang="pt-BR" data-role="admin" data-active="Início">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoSchool - Painel Administrativo</title>
    <!-- Design System -->
    <link rel="stylesheet" href="../shared/design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Página específica -->
    <link rel="stylesheet" href="adm.css">
</head>

<body class="page-wrapper">

    <!-- SIDEBAR INJETADA PELO shared/sidebar.js -->
    <aside id="sidebar"></aside>

    <main class="main-content">
        <div class="main-wrapper">
            <header id="introducao">
                <div>
                    <h1>Painel Administrativo</h1>
                    <p>Controle total do sistema AmaralHub</p>
                </div>
                <button class="notificacao" aria-label="Notificações">🔔</button>
            </header>

            <section id="conteiner">
                <div class="cardapio-header">
                    <div class="titulo-cardapio">
                        <span class="icone-cardapio">⚙️</span>
                        <h2>Gerenciamento Geral</h2>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                    <div style="background: #fff; padding: 20px; border-radius: 8px;">
                        <h3>Reservas Globais</h3>
                        <p>Monitore e gerencie todas as reservas feitas na plataforma.</p>
                        <a href="/reservas" style="display: inline-block; margin-top: 10px; color: #1976d2; text-decoration: none; font-weight: bold;">Acessar Módulo →</a>
                    </div>
                    <div style="background: #fff; padding: 20px; border-radius: 8px;">
                        <h3>Cardápios e Alimentos</h3>
                        <p>Atualize os pratos do dia e alertas de alérgenos.</p>
                        <a href="#" style="display: inline-block; margin-top: 10px; color: #1976d2; text-decoration: none; font-weight: bold;">Gerenciar Cardápio →</a>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Shared sidebar builder -->
    <script src="../shared/sidebar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!localStorage.getItem('userEmail')) {
                const pathAtual = window.location.pathname.toLowerCase();
                if (pathAtual.includes('aluno')) {
                    localStorage.setItem('userRole', 'aluno');
                } else if (pathAtual.includes('professor')) {
                    localStorage.setItem('userRole', 'professor');
                } else if (pathAtual.includes('adm')) {
                    localStorage.setItem('userRole', 'adm');
                }
            }
        });
    </script>
</body>
</html>
