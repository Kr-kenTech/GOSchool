  # ==========================================
  # Reservas Routes
  # ==========================================
  /api/reservas:
    get:
      tags: [Reservas]
      summary: Listar reservas
      description: |
        Lista reservas com filtros e paginação.
        - `aluno`: vê apenas suas reservas
        - `professor`/`adm`: vê todas (com filtro usuarioId opcional)
      operationId: listReservas
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [confirmada, cancelada, compareceu, nao_compareceu, todas]
            default: "todas"
        - name: dataInicio
          in: query
          schema:
            type: string
            format: date
        - name: dataFim
          in: query
          schema:
            type: string
            format: date
        - name: refeicaoTipo
          in: query
          schema:
            type: string
            enum: [almoco, jantar, lanche]
        - name: usuarioId
          in: query
          schema:
            type: integer
            description: Apenas para professor/adm
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Lista de reservas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaListResponse'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Reservas]
      summary: Criar reserva
      description: |
        Cria nova reserva de refeição.
        - `aluno`/`professor`: reserva para si mesmo
        - `adm`: pode reservar para qualquer usuarioId
      operationId: createReserva
      security:
        - cookieAuth: []
        - csrfAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservaRequest'
      responses:
        '201':
          description: Reserva criada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Reserva'
        '400':
          description: Dados inválidos, refeição inexistente ou reserva duplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflito (reserva já existe para esta data/refeição)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

