<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#44B7F8">
  <title>Entrar | GoSchool</title>
  <link rel="stylesheet" href="/design-system.css">
  <link rel="stylesheet" href="/Login/login.css">
  <script src="/theme.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <a class="login-back" href="/inicio/" aria-label="Voltar à página inicial">← <span>Voltar</span></a>
  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <img class="login-logo" src="/logo-simplificada.png" alt="GoSchool">
      <p class="login-eyebrow">PLATAFORMA EDUCACIONAL</p>
      <h1 id="login-title">Bem-vindo ao GoSchool</h1>
      <p class="login-subtitle">Entre com sua conta Google institucional para continuar.</p>

      <div class="login-action">
        <div id="google-signin" aria-label="Entrar com Google"></div>
      </div>
      <p id="login-status" class="login-status" role="status" aria-live="polite"></p>

      <div class="login-info">
        <span class="info-icon" aria-hidden="true">i</span>
        <p>Permitimos apenas contas <strong>@aluno.mg.gov.br</strong> e <strong>@educacao.mg.gov.br</strong>. O perfil e as permissões são definidos pela instituição.</p>
      </div>
      <p class="login-footer">Acesso seguro • Google OAuth 2.0</p>
    </section>
  </main>

  <script>
    (() => {
      const status = document.getElementById('login-status');
      const signin = document.getElementById('google-signin');
      const setStatus = (message, isError = false) => {
        status.textContent = message;
        status.classList.toggle('is-error', isError);
      };

      async function handleGoogleCredential(response) {
        if (!response || !response.credential) {
          setStatus('Não foi possível validar sua conta Google. Tente novamente.', true);
          return;
        }

        signin.setAttribute('aria-busy', 'true');
        setStatus('Validando sua conta institucional…');
        try {
          const result = await fetch('/auth/google/callback', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential })
          });
          const data = await result.json().catch(() => ({}));
          if (!result.ok || !data.sucesso) {
            throw new Error(data.erro || 'Não foi possível entrar com esta conta.');
          }
          window.location.replace(data.destino || '/inicio/');
        } catch (error) {
          setStatus(error.message || 'Falha de comunicação. Tente novamente.', true);
          signin.removeAttribute('aria-busy');
        }
      }

      async function initializeGoogleSignIn() {
        try {
          const configResponse = await fetch('/api/auth/config', { credentials: 'same-origin' });
          const config = await configResponse.json();
          if (!configResponse.ok || !config.clientId) {
            setStatus('O login institucional ainda não está configurado. Avise a coordenação.', true);
            return;
          }

          const waitForGoogle = () => {
            if (!window.google?.accounts?.id) {
              window.setTimeout(waitForGoogle, 100);
              return;
            }
            google.accounts.id.initialize({
              client_id: config.clientId,
              callback: handleGoogleCredential,
              auto_select: false,
              cancel_on_tap_outside: true
            });
            google.accounts.id.renderButton(signin, {
              type: 'standard',
              theme: 'outline',
              size: 'large',
              shape: 'pill',
              text: 'continue_with',
              logo_alignment: 'left',
              width: Math.min(360, signin.clientWidth || 360)
            });
          };
          waitForGoogle();
        } catch {
          setStatus('Não foi possível carregar o login. Verifique sua conexão e tente novamente.', true);
        }
      }

      document.addEventListener('DOMContentLoaded', initializeGoogleSignIn);
    })();
  </script>
</body>
</html>
